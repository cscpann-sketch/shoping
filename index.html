<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeraStore - Online Shopping</title>
<style>
  :root{
    --green:#1a7a4c; --green-dark:#125c39; --cream:#faf8f3; --ink:#1f2a24;
    --line:#e3ddd0; --amber:#d98c3c; --red:#c1443c; --blue:#3468a8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif; background:var(--cream); color:var(--ink);}
  header{
    background:var(--green); color:#fff; padding:14px 20px;
    display:flex; justify-content:space-between; align-items:center;
    position:sticky; top:0; z-index:50; box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header h1{font-size:1.4em; font-weight:700; letter-spacing:.5px;}
  header h1 span{color:var(--amber);}
  .cart-btn{
    background:var(--green-dark); border:none; color:#fff; padding:10px 16px;
    border-radius:8px; cursor:pointer; font-size:1em; position:relative; font-weight:600;
  }
  .cart-count{
    background:var(--amber); color:#fff; border-radius:50%; width:22px; height:22px;
    display:inline-flex; align-items:center; justify-content:center; font-size:.75em;
    position:absolute; top:-8px; right:-8px;
  }
  .tabs{display:flex; gap:8px; padding:12px 20px 0; background:#fff; border-bottom:1px solid var(--line);}
  .tab-btn{
    background:none; border:none; padding:10px 16px; cursor:pointer; font-size:.95em;
    border-bottom:3px solid transparent; color:#666; font-weight:600;
  }
  .tab-btn.active{color:var(--green); border-color:var(--green);}
  main{max-width:1100px; margin:0 auto; padding:20px;}
  .products{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px;}
  .card{
    background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .card img{width:100%; height:140px; object-fit:cover; background:#f0ece1;}
  .card .body{padding:12px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card .name{font-weight:600; font-size:.95em;}
  .card .price{color:var(--green); font-weight:700; font-size:1.1em;}
  .card .stock{font-size:.78em; color:#888;}
  .card .stock.out{color:var(--red); font-weight:600;}
  .add-btn{
    margin-top:auto; background:var(--green); color:#fff; border:none; padding:9px;
    border-radius:8px; cursor:pointer; font-weight:600;
  }
  .add-btn:disabled{background:#ccc; cursor:not-allowed;}
  .qty-row{display:flex; align-items:center; gap:8px; margin-top:auto;}
  .qty-row button{
    width:30px; height:30px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; font-size:1em;
  }
  .empty{text-align:center; color:#999; padding:40px; grid-column:1/-1;}

  .overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100;
    align-items:flex-start; justify-content:flex-end;
  }
  .overlay.show{display:flex;}
  .drawer{
    background:#fff; width:100%; max-width:400px; height:100%; padding:20px; overflow-y:auto;
    display:flex; flex-direction:column;
  }
  .drawer h2{margin-bottom:14px;}
  .close-x{align-self:flex-end; background:none; border:none; font-size:1.4em; cursor:pointer; color:#666;}
  .cart-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:8px;}
  .cart-item .ci-name{flex:1; font-size:.9em;}
  .cart-total{display:flex; justify-content:space-between; font-weight:700; font-size:1.15em; padding:14px 0; border-top:2px solid var(--ink);}
  input, textarea{
    width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; font-size:.95em;
  }
  label{font-size:.82em; color:#555; font-weight:600; margin-bottom:4px; display:block;}
  .primary-btn{
    background:var(--green); color:#fff; border:none; padding:12px; border-radius:8px;
    cursor:pointer; font-weight:700; font-size:1em; width:100%;
  }
  .primary-btn:disabled{background:#ccc;}
  .track-box{background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; max-width:500px; margin:0 auto;}
  .order-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px;}
  .badge{
    display:inline-block; padding:4px 10px; border-radius:20px; font-size:.75em; font-weight:700; color:#fff;
  }
  .b-pending{background:#999;} .b-confirmed{background:var(--blue);}
  .b-assigned{background:var(--amber);} .b-out_for_delivery{background:#7a4dc4;}
  .b-delivered{background:var(--green);} .b-cancelled{background:var(--red);}
  .order-items{font-size:.85em; color:#555; margin:6px 0;}
  .confirm-box{
    background:#fff; border:2px solid var(--green); border-radius:12px; padding:24px; text-align:center; max-width:450px; margin:30px auto;
  }
  .confirm-box .oid{font-size:1.3em; font-weight:700; color:var(--green); margin:10px 0;}
</style>
</head>
<body>

<header>
  <h1>Mera<span>Store</span></h1>
  <button class="cart-btn" onclick="openCart()">🛒 Cart <span class="cart-count" id="cartCount">0</span></button>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabShop" onclick="switchTab('shop')">Shop</button>
  <button class="tab-btn" id="tabTrack" onclick="switchTab('track')">Order Track Karo</button>
</div>

<main>
  <div id="shopView">
    <div class="products" id="productGrid">
      <div class="empty">Products load ho rahe hain...</div>
    </div>
  </div>

  <div id="trackView" style="display:none;">
    <div class="track-box">
      <label>Apna phone number daalein</label>
      <input type="tel" id="trackPhone" placeholder="10-digit mobile number">
      <button class="primary-btn" onclick="trackOrders()">Order Dekho</button>
    </div>
    <div id="trackResults" style="margin-top:20px;"></div>
  </div>
</main>

<div class="overlay" id="cartOverlay" onclick="if(event.target===this) closeCart()">
  <div class="drawer">
    <button class="close-x" onclick="closeCart()">&times;</button>
    <h2>Aapka Cart</h2>
    <div id="cartItems"><p style="color:#999;">Cart khaali hai</p></div>
    <div class="cart-total"><span>Total</span><span id="cartTotal">₹0</span></div>
    <button class="primary-btn" id="checkoutBtn" onclick="showCheckoutForm()" disabled>Checkout Karo</button>
  </div>
</div>

<div class="overlay" id="checkoutOverlay" onclick="if(event.target===this) closeCheckout()">
  <div class="drawer">
    <button class="close-x" onclick="closeCheckout()">&times;</button>
    <h2>Delivery Details</h2>
    <div id="checkoutForm">
      <label>Naam</label>
      <input type="text" id="custName" placeholder="Aapka poora naam">
      <label>Phone Number</label>
      <input type="tel" id="custPhone" placeholder="10-digit mobile number">
      <label>Poora Address</label>
      <textarea id="custAddress" rows="3" placeholder="House no, street, area, city, pincode"></textarea>
      <div class="cart-total"><span>Total</span><span id="checkoutTotal">₹0</span></div>
      <button class="primary-btn" onclick="placeOrder()">Order Place Karo</button>
    </div>
    <div id="checkoutConfirm" style="display:none;"></div>
  </div>
</div>

<!-- ============ FIREBASE SETUP ============ -->
<!-- IMPORTANT: Apna Firebase project banao (console.firebase.google.com), Firestore enable karo,
     aur neeche wali firebaseConfig ko apne project ke config se replace kar do.
     TEENO files (index.html, store-management.html, delivery-boy.html) mein SAME config daalna hai
     kyunki teeno same Firestore database use karte hain. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWVKmhzDeuQDpbJpBekLiPYhE3X11zLbc",
  authDomain: "online-shoping-9299a.firebaseapp.com",
  projectId: "online-shoping-9299a",
  storageBucket: "online-shoping-9299a.firebasestorage.app",
  messagingSenderId: "175906698523",
  appId: "1:175906698523:web:88a1ba267c88ca3b9a8fbe",
  measurementId: "G-C6VKH85QPJ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let products = [];
let cart = {}; // productId -> qty

// ---- Load products (realtime) ----
db.collection('products').where('active','==',true).onSnapshot(snap=>{
  products = [];
  snap.forEach(doc=> products.push({id:doc.id, ...doc.data()}));
  renderProducts();
}, err=>{
  document.getElementById('productGrid').innerHTML =
    '<div class="empty">Firebase config set nahi hai ya products nahi mile. Store Management page se products add karein.</div>';
});

function renderProducts(){
  const grid = document.getElementById('productGrid');
  if(products.length===0){
    grid.innerHTML = '<div class="empty">Abhi koi product available nahi hai.</div>';
    return;
  }
  grid.innerHTML = products.map(p=>{
    const qty = cart[p.id] || 0;
    const out = (p.stock||0) <= 0;
    return `<div class="card">
      <img src="${p.image || 'https://placehold.co/300x200?text='+encodeURIComponent(p.name)}" alt="${p.name}">
      <div class="body">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="price">₹${p.price}</div>
        <div class="stock ${out?'out':''}">${out?'Stock khatam':'Stock: '+p.stock}</div>
        ${qty>0 ?
          `<div class="qty-row">
            <button onclick="changeQty('${p.id}',-1)">−</button>
            <span>${qty}</span>
            <button onclick="changeQty('${p.id}',1)">+</button>
          </div>` :
          `<button class="add-btn" ${out?'disabled':''} onclick="changeQty('${p.id}',1)">${out?'Out of Stock':'Cart mein daalein'}</button>`
        }
      </div>
    </div>`;
  }).join('');
}

function changeQty(id, delta){
  const p = products.find(x=>x.id===id);
  const cur = cart[id] || 0;
  const next = Math.max(0, Math.min((p?.stock||99), cur+delta));
  if(next===0) delete cart[id]; else cart[id]=next;
  renderProducts();
  renderCart();
}

function cartArray(){
  return Object.entries(cart).map(([id,qty])=>{
    const p = products.find(x=>x.id===id);
    return p ? {id, name:p.name, price:p.price, qty} : null;
  }).filter(Boolean);
}

function cartTotal(){
  return cartArray().reduce((s,i)=>s+i.price*i.qty,0);
}

function renderCart(){
  const items = cartArray();
  document.getElementById('cartCount').textContent = items.reduce((s,i)=>s+i.qty,0);
  const box = document.getElementById('cartItems');
  const total = cartTotal();
  document.getElementById('cartTotal').textContent = '₹'+total;
  document.getElementById('checkoutBtn').disabled = items.length===0;
  if(items.length===0){
    box.innerHTML = '<p style="color:#999;">Cart khaali hai</p>';
    return;
  }
  box.innerHTML = items.map(i=>`
    <div class="cart-item">
      <span class="ci-name">${escapeHtml(i.name)} x ${i.qty}</span>
      <span>₹${i.price*i.qty}</span>
    </div>
  `).join('');
}

function openCart(){ document.getElementById('cartOverlay').classList.add('show'); renderCart(); }
function closeCart(){ document.getElementById('cartOverlay').classList.remove('show'); }
function showCheckoutForm(){
  closeCart();
  document.getElementById('checkoutOverlay').classList.add('show');
  document.getElementById('checkoutTotal').textContent = '₹'+cartTotal();
  document.getElementById('checkoutForm').style.display='block';
  document.getElementById('checkoutConfirm').style.display='none';
}
function closeCheckout(){ document.getElementById('checkoutOverlay').classList.remove('show'); }

async function placeOrder(){
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  if(!name || !phone || !address){ alert('Sabhi fields bharein'); return; }
  if(phone.length<10){ alert('Sahi phone number daalein'); return; }
  const items = cartArray();
  if(items.length===0){ alert('Cart khaali hai'); return; }

  const order = {
    customerName: name,
    phone: phone,
    address: address,
    items: items,
    total: cartTotal(),
    status: 'pending',
    deliveryBoyId: null,
    deliveryBoyName: null,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  try{
    const ref = await db.collection('orders').add(order);
    // reduce stock
    for(const i of items){
      db.collection('products').doc(i.id).update({
        stock: firebase.firestore.FieldValue.increment(-i.qty)
      });
    }
    cart = {};
    renderCart();
    document.getElementById('checkoutForm').style.display='none';
    document.getElementById('checkoutConfirm').style.display='block';
    document.getElementById('checkoutConfirm').innerHTML = `
      <div class="confirm-box">
        <div style="font-size:2em;">✅</div>
        <h2>Order Confirm Ho Gaya!</h2>
        <div class="oid">Order ID: ${ref.id.slice(-8).toUpperCase()}</div>
        <p style="color:#666;">Track karne ke liye "Order Track Karo" tab mein apna phone number daalein.</p>
        <button class="primary-btn" style="margin-top:14px;" onclick="closeCheckout(); switchTab('track'); document.getElementById('trackPhone').value='${phone}'; trackOrders();">Order Track Karein</button>
      </div>`;
  }catch(e){
    alert('Order place nahi ho paya. Firebase config check karein. Error: '+e.message);
  }
}

// ---- Tabs ----
function switchTab(tab){
  document.getElementById('tabShop').classList.toggle('active', tab==='shop');
  document.getElementById('tabTrack').classList.toggle('active', tab==='track');
  document.getElementById('shopView').style.display = tab==='shop' ? 'block':'none';
  document.getElementById('trackView').style.display = tab==='track' ? 'block':'none';
}

const statusLabels = {
  pending:'Order Received', confirmed:'Confirmed', assigned:'Delivery Boy Assign Hua',
  out_for_delivery:'Out for Delivery', delivered:'Delivered', cancelled:'Cancelled'
};

function trackOrders(){
  const phone = document.getElementById('trackPhone').value.trim();
  if(!phone){ alert('Phone number daalein'); return; }
  db.collection('orders').where('phone','==',phone).orderBy('createdAt','desc').get()
    .then(snap=>{
      const box = document.getElementById('trackResults');
      if(snap.empty){ box.innerHTML = '<p style="text-align:center;color:#999;">Is number se koi order nahi mila</p>'; return; }
      let html='';
      snap.forEach(doc=>{
        const o = doc.data();
        html += `<div class="order-card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong>#${doc.id.slice(-8).toUpperCase()}</strong>
            <span class="badge b-${o.status}">${statusLabels[o.status]||o.status}</span>
          </div>
          <div class="order-items">${o.items.map(i=>i.name+' x'+i.qty).join(', ')}</div>
          <div style="font-weight:700;">Total: ₹${o.total}</div>
          ${o.deliveryBoyName ? `<div style="font-size:.85em;color:#666;">Delivery Boy: ${escapeHtml(o.deliveryBoyName)}</div>` : ''}
        </div>`;
      });
      box.innerHTML = html;
    })
    .catch(e=>{ document.getElementById('trackResults').innerHTML = '<p style="color:red;">Error: '+e.message+'</p>'; });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
