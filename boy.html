<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Boy - MeraStore</title>
<style>
  :root{
    --amber:#d9832c; --amber-dark:#a8611b; --cream:#fdf6ec; --ink:#1f2a24;
    --line:#eadfc9; --green:#1a7a4c; --blue:#3468a8; --purple:#7a4dc4; --red:#c1443c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif; background:var(--cream); color:var(--ink);}
  header{
    background:var(--amber); color:#fff; padding:14px 20px; display:flex;
    justify-content:space-between; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.15);
    position:sticky; top:0; z-index:20;
  }
  header h1{font-size:1.25em;} header h1 span{color:#2b2b2b;}
  #logoutBtn{background:var(--amber-dark); color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;}

  #loginScreen{display:flex; align-items:center; justify-content:center; height:100vh; background:var(--amber-dark);}
  .login-box{background:#fff; padding:32px; border-radius:14px; width:320px; text-align:center;}
  .login-box h2{color:var(--amber-dark); margin-bottom:6px;}
  .login-box p{color:#888; font-size:.85em; margin-bottom:18px;}
  .login-box select, .login-box input{width:100%; padding:11px; border:1px solid var(--line); border-radius:8px; margin-bottom:12px; font-size:1em;}
  .login-box button{width:100%; padding:11px; background:var(--amber); color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer;}
  .login-err{color:var(--red); font-size:.85em; min-height:18px; margin-top:6px;}

  #app{display:none;}
  .tabs{display:flex; gap:4px; background:#fff; padding:0 20px; border-bottom:1px solid var(--line);}
  .tab-btn{background:none; border:none; padding:14px 16px; cursor:pointer; font-weight:600; color:#666; border-bottom:3px solid transparent;}
  .tab-btn.active{color:var(--amber-dark); border-color:var(--amber);}
  main{max-width:700px; margin:0 auto; padding:18px;}
  .view{display:none;} .view.active{display:block;}

  .order-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px;}
  .order-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .order-head .oid{font-weight:700;}
  .badge{display:inline-block; padding:4px 10px; border-radius:20px; font-size:.72em; font-weight:700; color:#fff;}
  .b-assigned{background:var(--amber);} .b-out_for_delivery{background:var(--purple);} .b-delivered{background:var(--green);}
  .info-row{font-size:.9em; color:#444; margin:4px 0;}
  .info-row b{color:#222;}
  .items-list{font-size:.85em; color:#555; background:#faf7f0; padding:8px 10px; border-radius:8px; margin:8px 0;}
  .btn{padding:10px 16px; border:none; border-radius:8px; cursor:pointer; font-weight:700; font-size:.9em; width:100%; margin-top:6px;}
  .btn-purple{background:var(--purple); color:#fff;}
  .btn-green{background:var(--green); color:#fff;}
  .empty{text-align:center; color:#999; padding:40px;}
  .call-link{color:var(--blue); text-decoration:none; font-weight:600;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h2>Delivery Boy Login</h2>
    <p>Apna naam chunein aur password daalein</p>
    <select id="boySelect"><option value="">Naam chunein...</option></select>
    <input type="password" id="boyPass" placeholder="Password" onkeydown="if(event.key==='Enter')boyLogin()">
    <button onclick="boyLogin()">Login</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Delivery<span> Panel</span></h1>
    <button id="logoutBtn" onclick="logout()">Logout</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('active')">Active Orders</button>
    <button class="tab-btn" onclick="switchTab('history')">History</button>
  </div>

  <main>
    <div class="view active" id="view-active">
      <div id="activeOrders"><div class="empty">Loading...</div></div>
    </div>
    <div class="view" id="view-history">
      <div id="historyOrders"><div class="empty">Loading...</div></div>
    </div>
  </main>
</div>

<!-- ============ FIREBASE SETUP ============ -->
<!-- IMPORTANT: index.html aur store-management.html jaisa hi SAME Firebase config yahan
     bhi daalein, taaki teeno pages ek hi Firestore database use karein. -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWVKmhzDeuQDpbJpBekLiPYhE3X11zLbc",
  authDomain: "online-shoping-9299a.firebaseapp.com",
  projectId: "online-shoping-9299a",
  storageBucket: "online-shoping-9299a.firebasestorage.app",
  messagingSenderId: "175906698523",
  appId: "1:175906698523:web:88a1ba267c88ca3b9a8fbe",
  measurementId: "G-C6VKH85QPJ"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let deliveryBoys = [];
let currentBoy = null;
let myOrders = [];

// Load delivery boys list for login dropdown
db.collection('deliveryBoys').where('active','!=',false).onSnapshot(snap=>{
  deliveryBoys = [];
  snap.forEach(d=>deliveryBoys.push({id:d.id,...d.data()}));
  const sel = document.getElementById('boySelect');
  sel.innerHTML = '<option value="">Naam chunein...</option>' +
    deliveryBoys.map(b=>`<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('');
}, err=>{
  document.getElementById('loginErr').textContent = 'Firebase config check karein / koi delivery boy add nahi hua';
});

function boyLogin(){
  const id = document.getElementById('boySelect').value;
  const pass = document.getElementById('boyPass').value;
  if(!id){ document.getElementById('loginErr').textContent = 'Naam chunein'; return; }
  const boy = deliveryBoys.find(b=>b.id===id);
  if(!boy || boy.password !== pass){
    document.getElementById('loginErr').textContent = 'Galat password';
    return;
  }
  currentBoy = boy;
  sessionStorage.setItem('db_boyid', boy.id);
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  initOrders();
}
function logout(){ sessionStorage.removeItem('db_boyid'); location.reload(); }

// auto-login if session exists
const savedId = sessionStorage.getItem('db_boyid');
if(savedId){
  db.collection('deliveryBoys').doc(savedId).get().then(doc=>{
    if(doc.exists){
      currentBoy = {id:doc.id, ...doc.data()};
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('app').style.display='block';
      initOrders();
    }
  });
}

function initOrders(){
  db.collection('orders').where('deliveryBoyId','==',currentBoy.id).onSnapshot(snap=>{
    myOrders = [];
    snap.forEach(d=>myOrders.push({id:d.id,...d.data()}));
    myOrders.sort((a,b)=>{
      const ta = a.createdAt?.seconds || 0, tb = b.createdAt?.seconds || 0;
      return tb - ta;
    });
    renderActive();
    renderHistory();
  });
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
}

function orderCardHtml(o, showAction){
  const statusLabel = o.status.replace(/_/g,' ');
  let action = '';
  if(showAction){
    if(o.status==='assigned'){
      action = `<button class="btn btn-purple" onclick="updateStatus('${o.id}','out_for_delivery')">Out for Delivery Mark Karein</button>`;
    }else if(o.status==='out_for_delivery'){
      action = `<button class="btn btn-green" onclick="updateStatus('${o.id}','delivered')">Delivered Mark Karein</button>`;
    }
  }
  return `<div class="order-card">
    <div class="order-head">
      <span class="oid">#${o.id.slice(-8).toUpperCase()}</span>
      <span class="badge b-${o.status}">${statusLabel}</span>
    </div>
    <div class="info-row"><b>Customer:</b> ${escapeHtml(o.customerName)}</div>
    <div class="info-row"><b>Phone:</b> <a class="call-link" href="tel:${o.phone}">${o.phone}</a></div>
    <div class="info-row"><b>Address:</b> ${escapeHtml(o.address)}</div>
    <div class="items-list">${o.items.map(i=>i.name+' x'+i.qty).join(', ')}</div>
    <div class="info-row"><b>Total:</b> ₹${o.total} ${o.paymentNote||'(Cash on Delivery)'}</div>
    ${action}
  </div>`;
}

function renderActive(){
  const list = myOrders.filter(o=>['assigned','out_for_delivery'].includes(o.status));
  const box = document.getElementById('activeOrders');
  box.innerHTML = list.length ? list.map(o=>orderCardHtml(o,true)).join('') : '<div class="empty">Koi active order nahi hai</div>';
}
function renderHistory(){
  const list = myOrders.filter(o=>o.status==='delivered');
  const box = document.getElementById('historyOrders');
  box.innerHTML = list.length ? list.map(o=>orderCardHtml(o,false)).join('') : '<div class="empty">Abhi tak koi delivery complete nahi hui</div>';
}

function updateStatus(orderId, status){
  db.collection('orders').doc(orderId).update({
    status, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
